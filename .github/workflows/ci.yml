name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: Typecheck, lint, tests, eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The whole engine is local, so the eval needs no secret and no network.
      # It gates every commit rather than being the expensive job people skip.
      - name: Golden-set eval and drift guard
        run: npm run eval

      # Everything the training script emits must match what the corpus and
      # features currently produce. If someone edits a pattern or adds training
      # data without retraining, this fails rather than letting the shipped
      # model, its published report, or the percentile curve go quietly stale.
      - name: Model artefacts are in step with the corpus
        run: |
          mkdir -p /tmp/committed
          cp lib/model/weights.json lib/model/report.json lib/model/score-distribution.json /tmp/committed/
          npm run train
          stale=0
          for f in weights.json report.json score-distribution.json; do
            if ! diff -q "/tmp/committed/$f" "lib/model/$f" > /dev/null; then
              echo "::error::lib/model/$f is stale — run \`npm run train\` and commit the result."
              stale=1
            fi
          done
          [ "$stale" -eq 0 ] && echo "all model artefacts match a fresh training run"
          exit $stale

      - run: npm run build

      # Boot the built server and check the pages actually render.
      #
      # Added after a relative og:image with no metadataBase threw inside
      # generateMetadata in production: the body rendered perfectly, every other
      # check passed, and the page still blanked on hydration. The status code
      # said 200 the whole time, so this asserts on the markup instead.
      #
      # VERCEL_PROJECT_PRODUCTION_URL is set so metadata resolves exactly the
      # way it does on the deploy, which is the half that only breaks remotely.
      - name: Smoke test the built server
        env:
          VERCEL_PROJECT_PRODUCTION_URL: grimyapper.vercel.app
        run: |
          npx next start -p 3000 &
          server=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3000 npm run smoke
          status=$?
          kill $server 2>/dev/null || true
          exit $status

      # A page must not fall over because an asset only one route needs is
      # missing. This is the bug that blanked permalinks in production: the
      # opengraph-image module read its fonts at import time, Next imports that
      # module to resolve the *page's* metadata, and the page's bundle carried
      # no fonts. It never failed locally, where the repository is the cwd.
      - name: Page renders without the share-image fonts
        env:
          VERCEL_PROJECT_PRODUCTION_URL: grimyapper.vercel.app
        run: |
          mv assets/fonts /tmp/fonts-hidden
          npx next start -p 3001 &
          server=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3001/ > /dev/null && break
            sleep 1
          done
          token=$(node -e "process.stdout.write(Buffer.from('A bakery selling sourdough.\t\t').toString('base64url'))")
          html=$(curl -sf "http://127.0.0.1:3001/j/$token" || true)
          kill $server 2>/dev/null || true
          mv /tmp/fonts-hidden assets/fonts
          if [ -z "$html" ]; then
            echo "::error::the permalink did not render at all without the fonts"
            exit 1
          fi
          if printf '%s' "$html" | grep -q 'data-dgst'; then
            echo "::error::a React boundary failed — something on the page reads an asset at import time"
            exit 1
          fi
          echo "page renders independently of the share-image fonts"
