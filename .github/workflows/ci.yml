name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: Typecheck, lint, tests, eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The whole engine is local, so the eval needs no secret and no network.
      # It gates every commit rather than being the expensive job people skip.
      - name: Golden-set eval and drift guard
        run: npm run eval

      # The shipped weights must match what the corpus and features produce.
      # If someone edits a pattern or adds training data without retraining,
      # this fails rather than letting the model silently go stale.
      - name: Weights are in step with the corpus
        run: |
          cp lib/model/weights.json /tmp/weights-committed.json
          npm run train
          if ! diff -q /tmp/weights-committed.json lib/model/weights.json > /dev/null; then
            echo "::error::lib/model/weights.json is stale — run \`npm run train\` and commit the result."
            exit 1
          fi
          echo "weights.json matches a fresh training run"

      - run: npm run build
