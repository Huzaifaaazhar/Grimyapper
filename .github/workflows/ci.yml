name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: Typecheck, lint, tests, eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The whole engine is local, so the eval needs no secret and no network.
      # It gates every commit rather than being the expensive job people skip.
      - name: Golden-set eval and drift guard
        run: npm run eval

      # Everything the training script emits must match what the corpus and
      # features currently produce. If someone edits a pattern or adds training
      # data without retraining, this fails rather than letting the shipped
      # model, its published report, or the percentile curve go quietly stale.
      - name: Model artefacts are in step with the corpus
        run: |
          mkdir -p /tmp/committed
          cp lib/model/weights.json lib/model/report.json lib/model/score-distribution.json /tmp/committed/
          npm run train
          stale=0
          for f in weights.json report.json score-distribution.json; do
            if ! diff -q "/tmp/committed/$f" "lib/model/$f" > /dev/null; then
              echo "::error::lib/model/$f is stale — run \`npm run train\` and commit the result."
              stale=1
            fi
          done
          [ "$stale" -eq 0 ] && echo "all model artefacts match a fresh training run"
          exit $stale

      - run: npm run build
